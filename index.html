<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <title data-i18n="page_title">丁未正科東港迎王平安祭典 - 數位繞境認證</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (作為備用字體) -->
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Serif+JP:wght@500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
    <!-- html2canvas 截圖下載用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- QRCode.js 動態生成真實 QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .font-title { font-family: 'Ma Shan Zheng', cursive; }
        .font-serif-tc { font-family: 'Noto Serif TC', 'Noto Serif JP', 'Noto Serif KR', serif; }
        .certificate-border {
            border: 12px double #8B0000;
            background-color: #FFFDF0;
            background-image: radial-gradient(#F5E6CC 15%, transparent 16%), radial-gradient(#F5E6CC 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        /* 鎖定狀態樣式 */
        .locked { opacity: 0.5; pointer-events: none; }

        /* 新增：套用您附圖的精美證書母版樣式 */
        #cert-card-final {
            /* 這裡設定您提供的證書母版圖片 URL (已預先處理為適合 Web 顯示) */
            /* 建議正式上線時使用本地圖片路徑以策安全 */
            background-image: url('https://i.imgur.com/T9M97e7.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 800px; /* 母版原始寬度 */
            height: 600px; /* 母版原始高度 */
            color: #5a3e2b; /* 證書基礎文字顏色，配合母版調整 */
            position: relative;
            overflow: hidden;
        }
        
        /* 精確定位證書文字 (使用絕對定位) */
        .cert-text-abs {
            position: absolute;
            font-family: 'Noto Serif TC', serif;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body class="bg-amber-950 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 主容器 -->
    <div class="max-w-xl w-full bg-white/95 backdrop-blur shadow-2xl rounded-xl p-6 md:p-8 border-4 border-amber-600">

            <div>
                <span class="bg-red-700 text-amber-100 text-xs px-2.5 py-1 rounded-full font-bold tracking-widest uppercase" data-i18n="badge_text">丁未正科・代天巡狩</span>

                <span class="text-xs text-amber-900 font-bold">🌐</span>

                    <option value="zh" selected>繁體中文</option>

                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="jp">日本語</option>

        <div class="text-center mb-6">

            <p class="text-sm text-amber-800 font-serif-tc mt-1" data-i18n="main_subtitle">王船隨香繞境・完整掃描認證系統</p>
        </div>

        <!-- 流程控制主面板 (互動介面) -->
        <div id="app-panel" class="space-y-5">
            <!-- 步驟 1: 填寫姓名 -->
            <div class="bg-amber-50 p-4 rounded-lg border border-amber-200 shadow-sm">
                <label class="block text-sm font-bold text-amber-900 mb-2 font-serif-tc" data-i18n="name_input_label">請輸入您的姓名（將印製於證明書）：</label>
                <input type="text" id="pilgrim-name" placeholder="例如：Alex / Shih-Min Liu / Carlos" class="w-full px-4 py-2 border border-amber-300 rounded-lg focus:ring-2 focus:ring-red-600 focus:outline-none text-gray-800 font-serif-tc font-bold">
            </div>

            <!-- 繞境進度追蹤提示與狀態卡片 -->

                </div>
                <p id="status-msg" class="text-xs text-red-600 font-medium h-4"></p>
            </div>

            <!-- 現場實體掃描點 QR Code 總覽區 -->
            <div class="border-t border-amber-200 pt-4 mt-2">
                <p class="text-xs font-bold text-amber-900 mb-3 text-center font-serif-tc" data-i18n="qr_section_title">📱 現場 QR Code 掃描點（供遊客依序掃描）：</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-center">
                    
                    <!-- 起點 QR Code -->
                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-300 flex flex-col items-center">
                        <span class="text-xs font-bold text-red-800 mb-2 font-serif-tc" data-i18n="qr_start_label">【起點站 QR Code】</span>
                        <div id="qrcode-start" class="bg-white p-2 rounded shadow-inner mb-2"></div>
                        <a id="link-start" href="#" onclick="simulateScan('start'); return false;" class="text-[11px] text-blue-700 font-bold underline mt-1" data-i18n="sim_start_btn">🔗 模擬掃描起點</a>
                    </div>

                    <!-- 終點 QR Code -->
                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-300 flex flex-col items-center">
                        <span class="text-xs font-bold text-red-800 mb-2 font-serif-tc" data-i18n="qr_end_label">【終點站 QR Code】</span>
                        <div id="qrcode-end" class="bg-white p-2 rounded shadow-inner mb-2 opacity-50" id="end-qr-box"></div>
                        <a id="link-end" href="#" onclick="simulateScan('end'); return false;" class="text-[11px] text-gray-400 font-bold underline mt-1 cursor-not-allowed" id="sim-end-link" data-i18n="sim_end_btn">🔗 模擬掃描終點 (需先完成起點)</a>
                    </div>

                </div>
            </div>
        </div>

        <!-- 步驟 3: 任務完成，顯示精美證書預覽區 (完成雙向掃描後自動解鎖顯示) -->
        <div id="certificate-container" class="hidden mt-4 space-y-6">
            
            <div id="cert-preview-box" class="p-2 bg-white rounded-lg shadow-inner">
                <!-- 這是在畫面上顯示的預覽圖，套用了您的精美母版 -->
                <div id="cert-card-final" class="scale-[0.6] origin-top-left -mb-[240px]"> <!-- 縮小以適應手機螢幕，並修正縮放後的邊距 -->
                    
                    <!-- 1. 證書編號 (定位在母版右上角淺色區) -->
                    <div class="cert-text-abs text-[12px] text-[#8a7355]" style="top: 74px; right: 65px; width: 100px; text-align: right;">
                        No. <span id="cert-id-display" class="font-mono">DT2027-0000</span>
                    </div>

                    <!-- 2. 受證者姓名 (定位在母版中央大字) -->
                    <div class="cert-text-abs font-bold text-[#800000] tracking-wider" style="top: 320px; left: 0; width: 800px; font-size: 60px; text-align: center;" id="display-name-final">
                        --
                    </div>

                    <!-- 3. 英文日期 (定位在下方) -->
                    <div class="cert-text-abs text-[14px] italic text-[#5a3e2b]" style="top: 518px; left: 160px; width: 300px; text-align: left;">
                        Issue Date: October 2027 (Dingwei Year)
                    </div>
                    
                    <!-- 4. 中文日期 (定位在下方對應位置) -->
                    <div class="cert-text-abs text-[14px] text-[#5a3e2b]" style="top: 518px; right: 160px; width: 300px; text-align: right;">
                        發證日期：西元 2027 年 10 月 (丁未年)
                    </div>

                </div>
            </div>

            <!-- 下載按鈕 -->
            <div class="flex gap-3 pt-2">
                <button onclick="downloadCertificateFinal()" class="flex-1 bg-red-700 hover:bg-red-800 text-white font-bold py-3 px-4 rounded-lg shadow transition flex items-center justify-center space-x-2 font-serif-tc text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    <span data-i18n="btn_download">下載圓滿功德證明書 (JPG)</span>
                </button>
                <button onclick="resetSystem()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 px-4 rounded-lg shadow transition font-serif-tc text-sm" data-i18n="btn_reset">
                    重新登記
                </button>
            </div>
        </div>

    </div>

    <!-- 系統核心邏輯 -->

            },

                msg_err_name: "⚠️ 스캔하기 전에 성명을 입력해 주세요!",
                msg_start_ok: "✅ 시작점 체크인 성공! 도착점으로 이동해 주세요.",

                badge_end_ok: "2. 도착: 완료 ✔",
                btn_download: "증명서 다운로드 (JPG)",
                btn_reset: "다시 입력"
            }
        };

        let currentLang = 'zh';

        window.onload = function() {
            const baseUrl = window.location.href.split('?')[0];
            const startUrl = baseUrl + "?point=start";
            const endUrl = baseUrl + "?point=end";

            document.getElementById("qrcode-start").innerHTML = "";
            document.getElementById("qrcode-end").innerHTML = "";

            new QRCode(document.getElementById("qrcode-start"), {
                text: startUrl, width: 120, height: 120, colorDark: "#7F1D1D", colorLight: "#ffffff"
            });
            document.getElementById("link-start").href = startUrl;
            document.getElementById("link-start").textContent = startUrl;

            new QRCode(document.getElementById("qrcode-end"), {
                text: endUrl, width: 120, height: 120, colorDark: "#7F1D1D", colorLight: "#ffffff"
            });
            document.getElementById("link-end").href = endUrl;
            document.getElementById("link-end").textContent = endUrl;

            const urlParams = new URLSearchParams(window.location.search);
            const point = urlParams.get('point');
            const dict = i18n[currentLang];

            let savedName = localStorage.getItem('pilgrim_name') || "";
            let startDone = localStorage.getItem('pilgrim_start') === "true";
            let endDone = localStorage.getItem('pilgrim_end') === "true";

            if (savedName) {
                document.getElementById('pilgrim-name').value = savedName;
            }

            if (point === 'start') {
                let name = document.getElementById('pilgrim-name').value.trim();
                if (!name) {
                    alert(dict['msg_err_name']);
                    return;
                }
                localStorage.setItem('pilgrim_name', name);
                localStorage.setItem('pilgrim_start', "true");
                startDone = true;
                document.getElementById('status-msg').style.color = "green";
                document.getElementById('status-msg').textContent = dict['msg_start_ok'];
            } else if (point === 'end') {
                if (!startDone) {
                    alert("⚠️ 您尚未完成起點掃描，請先掃描起點！");
                    return;
                }
                localStorage.setItem('pilgrim_end', "true");
                endDone = true;
            }

            updateProgressUI(startDone, endDone);

            if (startDone && endDone) {
                let name = localStorage.getItem('pilgrim_name') || "香客";
                // 更新預覽區的姓名與編號
                document.getElementById('display-name-final').textContent = name;
                document.getElementById('cert-id-display').textContent = "DT2027-" + Math.floor(1000 + Math.random() * 9000);

                document.getElementById('app-panel').classList.add('hidden');
                document.getElementById('certificate-container').classList.remove('hidden');
            }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            const dict = i18n[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerHTML = dict[key];
            });

            let startDone = localStorage.getItem('pilgrim_start') === "true";
            let endDone = localStorage.getItem('pilgrim_end') === "true";
            updateProgressUI(startDone, endDone);
        }

        function updateProgressUI(startDone, endDone) {
            const dict = i18n[currentLang];
            const badgeStart = document.getElementById('badge-start');
            const badgeEnd = document.getElementById('badge-end');

            if (startDone) {
                badgeStart.className = "px-3 py-1 rounded-full bg-green-100 text-green-800 font-bold";
                badgeStart.textContent = dict['badge_start_ok'];
            } else {
                badgeStart.className = "px-3 py-1 rounded-full bg-gray-200 text-gray-600";
                badgeStart.textContent = dict['badge_start_no'];
            }

            if (endDone) {
                badgeEnd.className = "px-3 py-1 rounded-full bg-green-100 text-green-800 font-bold";
                badgeEnd.textContent = dict['badge_end_ok'];
            } else {
                badgeEnd.className = "px-3 py-1 rounded-full bg-gray-200 text-gray-600";
                badgeEnd.textContent = dict['badge_end_no'];
            }
        }

        function downloadCertificateFinal() {
            const name = localStorage.getItem('pilgrim_name') || 'Pilgrim';
            const certElement = document.getElementById('cert-card-final');
            
            // 為了讓 html2canvas 能正確抓到背景圖片與文字定位，必須確保圖片載入完成
            const img = new Image();
            img.crossOrigin = "anonymous"; // 處理跨域問題
            img.src = certElement.style.backgroundImage.slice(5, -2);
            
            img.onload = function() {
                html2canvas(certElement, { 
                    scale: 2, // 高解析度
                    useCORS: true, // 允許跨域載入背景圖
                    logging: false
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Donggang_Festival_Certificate_${name}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                });
            };
            
            // 萬一圖片已經在快取中，手動觸發一次
            if (img.complete) img.onload();
        }

        function resetSystem() {
            localStorage.clear();
            window.location.href = window.location.pathname;
        }
    </script>
</body>
</html>
