<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (保留用作備用字體) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Serif+JP:wght@500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- QRCode.js 動態生成真實 QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .font-serif-tc { font-family: 'Noto Serif TC', 'Noto Serif JP', 'Noto Serif KR', serif; }
        /* 綠燈狀態 */
        .state-green { background-color: #DCFCE7; border-color: #166534; color: #166534; }
        /* 紅燈狀態 */
        .state-red { background-color: #FEE2E2; border-color: #991B1B; color: #991B1B; }
        /* 初始狀態 */
        .state-initial { background-color: #FFFbeb; border-color: #F59e0b; color: #991b1b; }
        
        /* 新增：精美證書背景樣式 */
        #cert-card {
            /* 這裡設定您提供的證書母版圖片 URL */
            /* 建議正式上線時使用本地圖片路徑 */
            background-image: url('https://i.imgur.com/Q54o5Vb.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 800px;
            height: 600px;
            color: #333; /* 基礎文字顏色，需配合背景調整 */
        }
        /* 精確定位證書文字 (使用絕對定位) */
        .cert-text { position: absolute; }
        
        /* 針對不同語言微調字體大小以適應版面 */
        [lang="en"] .dynamic-name { font-size: 2.5rem; } /* 英文名稍大 */
        [lang="zh"] .dynamic-name, [lang="zh-cn"] .dynamic-name { font-size: 3rem; } /* 中文名適中 */
        [lang="jp"] .dynamic-name { font-size: 2.5rem; }
        [lang="kr"] .dynamic-name { font-size: 2.5rem; }

    </style>

             <!-- 下載按鈕 -->

                <span data-i18n="btn_download">下載圓滿功德證明書</span>

            <div class="border-t border-amber-200 pt-4 mt-4 opacity-70">
                <p class="text-xs font-bold text-amber-900 mb-2 text-center font-serif-tc" data-i18n="qr_section_title">📱 現場人員掃描點：</p>
                <div class="grid grid-cols-2 gap-3 text-center text-[9px] text-amber-800">
                    <div>
                        <p class="font-bold mb-1" data-i18n="qr_start_label">起點 QR Code</p>
                        <div id="qrcode-start" class="bg-white p-1 rounded shadow inline-block"></div>
                    </div>
                    <div>
                        <p class="font-bold mb-1" data-i18n="qr_end_label">終點 QR Code</p>
                        <div id="qrcode-end" class="bg-white p-1 rounded shadow inline-block"></div>
                    </div>
                </div>

            </div>
        </div>

            <div id="cert-card" class="relative font-serif-tc text-[#5C4033]">
                
                <!-- 1. 證書編號 (右上角淺色區域) -->

                    No. <span id="cert-id" class="font-mono">DT2027-0000</span>
                </div>

                <!-- 2. 主要受證者姓名 (置中，大字體) -->
                <div class="cert-text dynamic-name font-bold text-[#800000] tracking-wider" style="top: 335px; left: 0; width: 800px; text-align: center;" id="display-name">
                    --
                </div>

                <!-- 3. 英文日期 (下方) -->
                 <div class="cert-text text-xs italic text-[#5C4033]" style="top: 518px; left: 160px; width: 300px; text-align: left;" data-i18n="cert_date_en">
                    Issue Date: October 2027 (Dingwei Year)

                <div class="cert-text text-xs text-[#5C4033]" style="top: 518px; right: 160px; width: 300px; text-align: right;" data-i18n="cert_date_zh">
                    發證日期：西元 2027 年 10 月 (丁未年)
                </div>

            </div>
        </div>

    </div>

        let currentLang = 'zh';
        let startDone = localStorage.getItem('pilgrim_start_v2') === "true";
        let endDone = localStorage.getItem('pilgrim_end_v2') === "true";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const scanPoint = urlParams.get('point');
            const dict = i18n[currentLang];

            if (scanPoint === 'start') {
                localStorage.setItem('pilgrim_start_v2', "true");
                startDone = true;
                document.getElementById('status-card').scrollIntoView({ behavior: 'smooth' });
            } else if (scanPoint === 'end') {
                 if (!startDone) {
                     // 防止直接掃描終點，自動導向首頁
                    window.location.href = window.location.pathname;
                    return;
                 }
                localStorage.setItem('pilgrim_end_v2', "true");
                endDone = true;
                 document.getElementById('cert-card').scrollIntoView({ behavior: 'smooth' });
            }

            let savedName = localStorage.getItem('pilgrim_name');
            if (savedName) document.getElementById('pilgrim-name').value = savedName;

            updateSystemState(startDone, endDone);

            const baseUrl = window.location.href.split('?')[0];
            const startUrl = baseUrl + "?point=start";
            const endUrl = baseUrl + "?point=end";

            new QRCode(document.getElementById("qrcode-start"), {
                text: startUrl, width: 80, height: 80, colorDark: "#7F1D1D", colorLight: "#ffffff"
            });
            new QRCode(document.getElementById("qrcode-end"), {
                text: endUrl, width: 80, height: 80, colorDark: "#7F1D1D", colorLight: "#ffffff"
            });
        };

        function changeLanguage(lang) {
            currentLang = lang;
            const dict = i18n[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerHTML = dict[key];
            });
            updateSystemState(startDone, endDone);
        }

        function updateSystemState(s, e) {
            const dict = i18n[currentLang];
            const container = document.getElementById('main-container');
            const card = document.getElementById('status-card');
            const iconBox = document.getElementById('icon-box');
            const instruction = document.getElementById('status-instruction');
            const detail = document.getElementById('status-detail');
            const downloadBtn = document.getElementById('download-btn');
            const header = document.getElementById('header-nav');

            if (e) {
                // 終點 (紅燈)
                container.className = "max-w-xl w-full bg-white/95 backdrop-blur shadow-2xl rounded-xl p-6 md:p-8 border-4 border-amber-600 transition-all duration-300 state-red";
                header.className = "flex justify-between items-center mb-4 border-b border-red-300 pb-3 transition-colors duration-300";
                card.className = "p-6 rounded-xl border-2 transition-all duration-500 text-center space-y-3 shadow-lg state-red border-red-300";
                iconBox.innerHTML = "🏁";
                iconBox.style.transform = "scale(1.2)";
                instruction.textContent = dict['instruction_end'];
                detail.textContent = dict['msg_end_detail'];
                downloadBtn.classList.remove('hidden');
            } else if (s) {
                // 起點 (綠燈)
                container.className = "max-w-xl w-full bg-white/95 backdrop-blur shadow-2xl rounded-xl p-6 md:p-8 border-4 border-amber-600 transition-all duration-300 state-green";
                header.className = "flex justify-between items-center mb-4 border-b border-green-300 pb-3 transition-colors duration-300";
                card.className = "p-6 rounded-xl border-2 transition-all duration-500 text-center space-y-3 shadow-lg state-green border-green-300";
                iconBox.innerHTML = "✅";
                iconBox.style.transform = "scale(1.2)";
                instruction.textContent = dict['instruction_start'];
                detail.textContent = dict['msg_start_detail'];
                downloadBtn.classList.add('hidden');
            } else {
                 // 初始 (黃燈)
                container.className = "max-w-xl w-full bg-white/95 backdrop-blur shadow-2xl rounded-xl p-6 md:p-8 border-4 border-amber-600 transition-all duration-300 state-initial";
                header.className = "flex justify-between items-center mb-4 border-b border-amber-200 pb-3 transition-colors duration-300";
                card.className = "p-6 rounded-xl border-2 transition-all duration-500 text-center space-y-3 shadow-lg state-initial border-amber-300";
                iconBox.innerHTML = "📱";
                iconBox.style.transform = "scale(1)";
                instruction.textContent = dict['instruction_init'];
                detail.textContent = "";
                downloadBtn.classList.add('hidden');
            }
        }

        function downloadCertificate() {
            const name = document.getElementById('pilgrim-name').value.trim();
            const dict = i18n[currentLang];
            if (!name) {
                alert(dict['err_name']);
                document.getElementById('pilgrim-name').focus();
                return;
            }

            // 更新證書上的姓名與編號
            document.getElementById('display-name').textContent = name;
            document.getElementById('cert-id').textContent = "DT2027-" + Math.floor(1000 + Math.random() * 9000);
            
            const certTemplate = document.getElementById('certificate-template');
            certTemplate.style.left = "0px"; // 移出畫面外準備截圖

            html2canvas(document.getElementById('cert-card'), { scale: 2, useCORS: true, logging: false }).then(canvas => {
                certTemplate.style.left = "-9999px"; // 截圖完成後移回隱藏
                const link = document.createElement('a');
                link.download = `Donggang_Festival_Certificate_${name}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            });
        }

        function resetSystem() {
            localStorage.removeItem('pilgrim_start_v2');
            localStorage.removeItem('pilgrim_end_v2');
            localStorage.removeItem('pilgrim_name');
            location.reload();
        }
    </script>
</body>
</html>
