<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">丁未正科東港迎王平安祭典 - 數位認證</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- html2canvas 截圖下載用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- QRCode.js 動態生成真實 QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .font-serif-tc { font-family: 'Noto Serif TC', serif; }
        
        /* 國際版證書母版樣式 */
        .certificate-container-final {
            width: 800px;
            height: 600px;
            background-image: url('certificate-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            box-sizing: border-box;
        }
        
        .locked { opacity: 0.5; pointer-events: none; }
        .state-green { background-color: #DCFCE7; border-color: #166534; color: #166534; }
        .state-red { background-color: #FEE2E2; border-color: #991B1B; color: #991B1B; }
        .state-initial { background-color: #FFFbeb; border-color: #F59e0b; color: #991b1b; }
    </style>
</head>
<body class="bg-amber-950 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 主容器 -->
    <div id="main-container" class="max-w-xl w-full bg-white/95 backdrop-blur shadow-2xl rounded-xl p-6 md:p-8 border-4 border-amber-600 transition-all duration-300 state-initial">
        
        <!-- 頂部導覽與多語系切換 -->
        <div id="header-nav" class="flex justify-between items-center mb-4 border-b border-amber-200 pb-3 transition-colors duration-300">
            <div>
                <span class="bg-red-700 text-amber-100 text-xs px-2.5 py-1 rounded-full font-bold tracking-widest uppercase" data-i18n="badge_text">丁未正科・代天巡狩</span>
            </div>
            <div class="flex items-center space-x-1">
                <span class="text-xs text-amber-900 font-bold">🌐</span>
                <select id="lang-selector" onchange="changeLanguage(this.value)" class="text-xs bg-amber-50 border border-amber-300 rounded px-2 py-1 text-amber-900 font-bold focus:outline-none focus:ring-1 focus:ring-red-600">
                    <option value="zh" selected>繁體中文</option>
                    <option value="zh-cn">简体中文</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="jp">日本語</option>
                    <option value="kr">한국어</option>
                </select>
            </div>
        </div>

        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold font-serif-tc text-amber-900" data-i18n="main_title">東港迎王平安祭典</h1>
            <p class="text-sm text-amber-800 font-serif-tc mt-1" data-i18n="main_subtitle">王船隨香繞境・直覺式數位認證</p>
        </div>

        <!-- 流程控制主面板 -->
        <div id="app-panel" class="space-y-5">
            <!-- 步驟 1: 填寫姓名 -->
            <div class="bg-white/50 p-4 rounded-lg border border-amber-200 shadow-inner">
                <label class="block text-sm font-bold text-amber-900 mb-2 font-serif-tc" data-i18n="name_input_label">請輸入您的姓名（將印製於證明書）：</label>
                <input type="text" id="pilgrim-name" placeholder="例如：陳小明 / Alex / 山田太郎" class="w-full px-4 py-2.5 border border-amber-300 rounded-lg focus:ring-2 focus:ring-red-600 focus:outline-none text-gray-800 font-serif-tc font-bold text-lg">
            </div>

            <!-- 步驟 2 & 3: 綠紅燈狀態顯示卡片 -->
            <div id="status-card" class="p-6 rounded-xl border-2 transition-all duration-500 text-center space-y-3 shadow-lg">
                <div id="icon-box" class="text-5xl transition-transform duration-500"></div>
                <p id="status-instruction" class="text-lg font-bold font-serif-tc" data-i18n="instruction_init">請準備掃描起點 QR Code</p>
                <p id="status-detail" class="text-xs text-amber-950/70"></p>
            </div>

            <!-- 下載按鈕 (預設隱藏) -->
            <button id="download-btn" onclick="downloadCertificateFinal()" class="hidden w-full bg-red-700 hover:bg-red-800 text-white font-bold py-4 px-6 rounded-xl shadow-xl transition duration-300 transform scale-105 font-serif-tc text-xl flex items-center justify-center space-x-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                <span data-i18n="btn_download">下載圓滿功德證明書</span>
            </button>

            <!-- 現場實體掃描點 QR Code 總覽區 (已修復圖片生成) -->
            <div class="border-t border-amber-200 pt-4 mt-2">
                <p class="text-xs font-bold text-amber-900 mb-3 text-center font-serif-tc" data-i18n="qr_section_title">📱 現場 QR Code 掃描點（供遊客依序掃描）：</p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-center">
                    
                    <!-- 起點 QR Code -->
                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-300 flex flex-col items-center">
                        <span class="text-xs font-bold text-red-800 mb-2 font-serif-tc" data-i18n="qr_start_label">【起點站 QR Code】</span>
                        <div id="qrcode-start" class="bg-white p-2 rounded shadow-inner mb-2 flex justify-center"></div>
                        <a id="link-start" href="#" class="text-[11px] text-blue-700 font-bold underline mt-1" data-i18n="sim_start_btn">測試起點連結</a>
                    </div>

                    <!-- 終點 QR Code -->
                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-300 flex flex-col items-center">
                        <span class="text-xs font-bold text-red-800 mb-2 font-serif-tc" data-i18n="qr_end_label">【終點站 QR Code】</span>
                        <div id="qrcode-end" class="bg-white p-2 rounded shadow-inner mb-2 flex justify-center"></div>
                        <a id="link-end" href="#" class="text-[11px] text-blue-700 font-bold underline mt-1" data-i18n="sim_end_btn">測試終點連結</a>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- 精美證書套印區域 (隱藏於畫面外，供截圖下載使用) -->
    <div id="certificate-template" class="fixed -left-[9999px] top-0">
        <div id="cert-card-final" class="certificate-container-final font-serif-tc">
            <!-- 1. 受證者姓名 -->
            <div class="absolute font-bold text-[#800000] tracking-wider" style="top: 425px; left: 240px; width: 320px; font-size: 28px; text-align: center;" id="display-name-final">
                --
            </div>
            <!-- 2. 證書編號 -->
            <div class="absolute text-[11px] text-[#5a3e2b] font-mono font-bold" style="top: 815px; left: 710px; width: 150px;">
                <span id="cert-id-display">DT2027-4953</span>
            </div>
        </div>
    </div>

    <!-- 系統核心邏輯 -->
    <script>

            },

            },

            },
            jp: {
                page_title: "丁未年 東港迎王平安祭典 - 認証",
                badge_text: "丁未正科・代天巡狩",

                instruction_start: "✅ 起点チェックイン完了！巡行を開始してください。",
                instruction_end: "🎉 巡行修了！証明書をダウンロードしてください。",
                msg_start_detail: "起点が記録されました。終点へ向かってください。",
                msg_end_detail: "認証完了しました。下のボタンからダウンロードできます。",
                err_name: "⚠️ 先にお名前を入力してください！",
                btn_download: "証明書をダウンロード (JPG)"
            },
            kr: {
                page_title: "정미년 동강 왕선 순행 평안 제전 - 인증",
                badge_text: "정미정과・대천순수",
                main_title: "동강 왕선 평안 제전",
                main_subtitle: "왕선 순행 동행・현장 스캔 인증",
                name_input_label: "성명을 입력해 주세요 (증명서용):",
                qr_section_title: "📱 현장 QR 코드 스캔 포인트:",
                qr_start_label: "[시작점 QR 코드]",
                qr_end_label: "[도착점 QR 코드]",
                sim_start_btn: "시작 링크 테스트",
                sim_end_btn: "도착 링크 테스트",
                instruction_init: "성명을 먼저 입력한 후, 시작 QR 코드를 스캔하세요",
                instruction_start: "✅ 시작 체크인 성공! 순행을 시작하세요.",
                instruction_end: "🎉 순행 완주! 증명서를 다운로드하세요.",
                msg_start_detail: "시작점이 기록되었습니다. 도착점으로 이동하세요.",
                msg_end_detail: "인증이 완료되었습니다. 아래 버튼을 눌러 다운로드하세요.",
                err_name: "⚠️ 성명을 먼저 입력해 주세요!",
                btn_download: "증명서 다운로드 (JPG)"
            }
        };

        let currentLang = 'zh';

        window.onload = function() {
            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            const startUrl = baseUrl + "?point=start";
            const endUrl = baseUrl + "?point=end";

            // 確保每次載入都重新生成 QR Code 圖片
            const qrcodeStartEl = document.getElementById("qrcode-start");
            const qrcodeEndEl = document.getElementById("qrcode-end");
            qrcodeStartEl.innerHTML = "";
            qrcodeEndEl.innerHTML = "";

            new QRCode(qrcodeStartEl, {
                text: startUrl, width: 128, height: 128, colorDark: "#7F1D1D", colorLight: "#ffffff"
            });
            document.getElementById("link-start").href = startUrl;

            new QRCode(qrcodeEndEl, {
                text: endUrl, width: 128, height: 128, colorDark: "#7F1D1D", colorLight: "#ffffff"
            });
            document.getElementById("link-end").href = endUrl;

            const urlParams = new URLSearchParams(window.location.search);
            const point = urlParams.get('point');
            const dict = i18n[currentLang];

            let savedName = localStorage.getItem('pilgrim_name') || "";
            let startDone = localStorage.getItem('pilgrim_start_ok') === "true";
            let endDone = localStorage.getItem('pilgrim_end_ok') === "true";

            if (savedName) {
                document.getElementById('pilgrim-name').value = savedName;
            }

            document.getElementById('pilgrim-name').addEventListener('input', function() {
                localStorage.setItem('pilgrim_name', this.value.trim());
            });

            if (point === 'start') {
                let currentName = localStorage.getItem('pilgrim_name') || document.getElementById('pilgrim-name').value.trim();
                if (!currentName) {
                    alert(dict['err_name']);
                    window.location.href = baseUrl;
                    return;
                }
                localStorage.setItem('pilgrim_name', currentName);
                localStorage.setItem('pilgrim_start_ok', "true");
                startDone = true;
                history.replaceState(null, '', baseUrl);
            } else if (point === 'end') {
                if (!startDone) {
                    alert("⚠️ 尚未完成起點報到，請先至起點掃描！");
                    window.location.href = baseUrl;
                    return;
                }
                localStorage.setItem('pilgrim_end_ok', "true");
                endDone = true;
                history.replaceState(null, '', baseUrl);
            }

            updateUIState(startDone, endDone);
        };

        function changeLanguage(lang) {
            currentLang = lang;
            const dict = i18n[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerHTML = dict[key];
            });
            let startDone = localStorage.getItem('pilgrim_start_ok') === "true";
            let endDone = localStorage.getItem('pilgrim_end_ok') === "true";
            updateUIState(startDone, endDone);
        }

        function updateUIState(s, e) {
            const dict = i18n[currentLang];
            const container = document.getElementById('main-container');
            const header = document.getElementById('header-nav');
            const card = document.getElementById('status-card');
            const iconBox = document.getElementById('icon-box');
            const instruction = document.getElementById('status-instruction');
            const detail = document.getElementById('status-detail');
            const downloadBtn = document.getElementById('download-btn');

            if (e) {
                container.className = "max-w-xl w-full bg-white/95 backdrop-blur shadow-2xl rounded-xl p-6 md:p-8 border-4 border-amber-600 transition-all duration-300 state-red";
                header.className = "flex justify-between items-center mb-4 border-b border-red-300 pb-3 transition-colors duration-300";
                card.className = "p-6 rounded-xl border-2 transition-all duration-500 text-center space-y-3 shadow-lg state-red border-red-300";
                iconBox.innerHTML = "🏁";
                instruction.textContent = dict['instruction_end'];
                detail.textContent = dict['msg_end_detail'];
                downloadBtn.classList.remove('hidden');
            } else if (s) {
                container.className = "max-w-xl w-full bg-white/95 backdrop-blur shadow-2xl rounded-xl p-6 md:p-8 border-4 border-amber-600 transition-all duration-300 state-green";
                header.className = "flex justify-between items-center mb-4 border-b border-green-300 pb-3 transition-colors duration-300";
                card.className = "p-6 rounded-xl border-2 transition-all duration-500 text-center space-y-3 shadow-lg state-green border-green-300";
                iconBox.innerHTML = "✅";
                instruction.textContent = dict['instruction_start'];
                detail.textContent = dict['msg_start_detail'];
                downloadBtn.classList.add('hidden');
            } else {
                container.className = "max-w-xl w-full bg-white/95 backdrop-blur shadow-2xl rounded-xl p-6 md:p-8 border-4 border-amber-600 transition-all duration-300 state-initial";
                header.className = "flex justify-between items-center mb-4 border-b border-amber-200 pb-3 transition-colors duration-300";
                card.className = "p-6 rounded-xl border-2 transition-all duration-500 text-center space-y-3 shadow-lg state-initial border-amber-300";
                iconBox.innerHTML = "📱";
                instruction.textContent = dict['instruction_init'];
                detail.textContent = "";
                downloadBtn.classList.add('hidden');
            }
        }

        function downloadCertificateFinal() {
            const name = localStorage.getItem('pilgrim_name') || document.getElementById('pilgrim-name').value.trim();
            const dict = i18n[currentLang];
            if (!name) {
                alert(dict['err_name']);
                document.getElementById('pilgrim-name').focus();
                return;
            }

            document.getElementById('display-name-final').textContent = name;
            document.getElementById('cert-id-display').textContent = "DT2027-" + Math.floor(1000 + Math.random() * 9000);
            
            const certElement = document.getElementById('cert-card-final');
            const templateHolder = document.getElementById('certificate-template');
            templateHolder.style.left = "0px";

            html2canvas(certElement, { 
                scale: 2, 
                useCORS: true, 
                logging: false 
            }).then(canvas => {
                templateHolder.style.left = "-9999px";
                const link = document.createElement('a');
                link.download = `Donggang_Festival_Certificate_${name}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            });
        }
    </script>
</body>
</html>
